[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'taskcli-amna'
version = '0.1.0'
description = 'A simple Command line task manager'
readme = 'README.md'
requires-python = '>=3.9'
dependencies = []

[project.optional-dependencies]
dev = ['pytest']

[project.scripts]
task = 'taskcli.cli:main'